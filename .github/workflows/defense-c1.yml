name: Defense C1 Simulation (SHA Pinning)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call Immutable Pinned Action
        uses: mhyaristanbouli-art/lab-action@c0aa49198ce3894b3c3180b4c9b40558f4bf25e1
        env:
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
