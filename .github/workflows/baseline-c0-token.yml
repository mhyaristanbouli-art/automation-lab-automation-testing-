name: Baseline C0 (Default Token Permissions)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt Privileged API Action (unrestricted)
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://api.github.com/repos/${{ github.repository }}/issues \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Content-Type: application/json" \
            -d '{"title":"C0 Baseline Test Issue"}')
          echo "API Response Code: $response"
          if [ "$response" == "201" ]; then
            echo "Baseline: privileged action succeeded as expected."
          else
            echo "::warning::Baseline call did not return 201 (got $response) — check Issues are enabled on this repo."
            exit 1
          fi
