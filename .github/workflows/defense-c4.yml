name: Defense C4 Simulation (Secret Scanning / Detection)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulated Secret Scan Check
        env:
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
        run: |
          # Simulating pattern matching detection rule for secrets in environment
          if echo "$LAB_CANARY" | grep -E "(dummy-secret|canary)"; then
            echo "::error::Secret pattern detected in runner memory!"
            exit 1
          fi
