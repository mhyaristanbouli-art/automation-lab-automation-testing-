name: Defense C1 Simulation (SHA Pinning)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call Immutable Pinned Action
        uses: mhyaristanbouli-art/lab-action@<BENIGN_SHA>
        env:
          LAB_LISTENER: ${{ vars.LAB_LISTENER }}
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
