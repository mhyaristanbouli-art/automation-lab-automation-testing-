name: Defense C1 Simulation (SHA Pinning)
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call Immutable Pinned Action
        uses: mhyaristanbouli-art/lab-action@8382891d6260a83c746b746ea566e2ab9d59aa50
        env:
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
