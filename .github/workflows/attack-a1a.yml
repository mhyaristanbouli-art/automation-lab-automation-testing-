name: Attack A1a Simulation
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Call Mutable Action Tag (Retargeted)
        uses: mhyaristanbouli-art/lab-action@v1
        env:
          LAB_LISTENER: ${{ vars.LAB_LISTENER }}
          LAB_CANARY: ${{ secrets.LAB_CANARY }}
